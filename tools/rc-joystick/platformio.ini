; ============================================================
; RC JOYSTICK — пульт FS-i6 как USB-джойстик для симулятора
;
; ОТДЕЛЬНЫЙ проект, с прошивкой полётника не связан: свой код, своя
; сборка. На плату шьётся ЛИБО эта прошивка, ЛИБО полётная — каждая
; заливка целиком заменяет предыдущую, место во флеше они не делят.
;
; Собрать и залить (из корня репозитория):
;   pio run -d tools/rc-joystick -t upload
; Вернуть прошивку полётника:
;   pio run -t upload
; ============================================================

[platformio]
default_envs = esp32-s3

; ESP32-S3 N16R8, та же плата, что у полётника.
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Встроенный USB (разъём "USB") — TinyUSB, то есть джойстик (HID), а
; не USB-JTAG: ARDUINO_USB_MODE=0. Задаётся заменой extra_flags платы
; (там USB_MODE=1), а не build_flags — иначе "redefined" на каждый файл.
; Лог и прошивка — как обычно, через разъём "COM".
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
