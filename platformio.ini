; Выбор платы — одна строка:
;   pio run -e stm32h743-devebox (STM32H743 на плате DevEBox H743 — основная плата, по умолчанию)
;   pio run -e esp32-s3   (ESP32-S3 N16R8, прежняя основная плата)
;   pio run -e esp32-c3   (ESP32-C3 SuperMini, старый прототип)
;   pio run -e esp32-dev  (обычная ESP32 38-pin, для стенда/отладки)
;   pio run -e stm32h743  (тот же STM32H743VIT6 на плате WeAct MiniSTM32H743)
; Пины для каждой платы — в include/config/Config.h (ищите BOARD_*).
; Чтобы прошивка собиралась без -e по умолчанию, поменяйте default_envs.
;
; Тесты и статический анализ (подробно — docs/TESTING.md):
;   pio test -e native        (на ПК, с фейками Arduino/ESP32, покрытие — gcovr)
;   pio test -e esp32-s3      (на плате: test_feedback, test_imu_orientation)
;   pio check -e esp32-s3     (cppcheck по include/ и src/)
;   pio check -e stm32h743    (cppcheck по коду STM32: include/hal/stm32/, src/stm32/)

[platformio]
default_envs = stm32h743-devebox

; Общее для прошивки на всех платах ESP32.
[esp32_common]
platform = espressif32
framework = arduino
lib_deps =
    olikraus/U8g2@^2.36.18
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D IR_DEBUG=1
    -D HTTP_DEBUG=0
; src/stm32/ — точка входа платы STM32 (env:stm32h743), не ESP32.
build_src_filter = +<*> -<stm32/>
; test/native*/ собираются только с фейками железа (env:native, env:native-stm32).
test_ignore =
    native/*
    native_stm32/*
    test_blackbox_sd
check_tool = cppcheck
check_skip_packages = yes
check_src_filters =
    +<include/>
    -<include/hal/stm32/>
    +<src/>
    -<src/stm32/>
check_flags =
    cppcheck: --enable=warning,style,performance,portability --inline-suppr --suppress=*:*/.pio/*

[env:esp32-c3]
extends = esp32_common
board = esp32-c3-devkitm-1
build_flags =
    ${esp32_common.build_flags}
    -D BOARD_ESP32_C3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
monitor_dtr = 0
monitor_rts = 0

; ESP32-S3-WROOM-1 N16R8: 16 МБ QIO-флеш + 8 МБ octal (OPI) PSRAM.
; Без memory_type=qio_opi PSRAM не определяется, а GPIO33-37 заняты
; ею физически (см. Config.h). Дефолтная плата esp32-s3-devkitc-1
; описывает 8 МБ флеша без PSRAM — поэтому размеры заданы явно.
; Разделы: приложение 2 МБ, остальное — чёрный ящик (partitions_blackbox.csv).
;
; Serial идёт через UART0 -> мост CH343 -> разъём "COM" (не нативный
; USB): порт не пропадает при перезагрузке/падении, виден лог
; загрузчика и паники, и запись в Serial не блокируется, когда
; монитор не открыт (у нативного USB-CDC это бывает). Прошивка —
; тоже через "COM" (автосброс по DTR/RTS).
[env:esp32-s3]
extends = esp32_common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions_blackbox.csv
build_flags =
    ${esp32_common.build_flags}
    -D BOARD_ESP32_S3
    -D BOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
monitor_dtr = 0
monitor_rts = 0

[env:esp32-dev]
extends = esp32_common
board = esp32dev
build_flags =
    ${esp32_common.build_flags}
    -D BOARD_ESP32_CLASSIC
; Дешёвый CH340-мост на этой плате не тянет дефолтные 921600 бод —
; на них esptool видит download mode, но не получает sync reply
; ("TX path seems to be down"). 115200 надёжнее для заливки.
upload_speed = 115200

; STM32H743VIT6 — полная прошивка (автопилот, датчики, трубка Пито,
; телеметрия MAVLink, экран, чёрный ящик на SD-карте); на железе проверена
; голая плата DevEBox — она и есть основная плата (env stm32h743-devebox ниже). Плата PlatformIO здесь — WeAct MiniSTM32H743VITx:
; тот же чип, распиновка в Config.h (BOARD_STM32H743) подобрана под
; свободные пины этой платы. Точка входа — src/stm32/main.cpp (задачи
; FreeRTOS вместо loop() на двух ядрах ESP32).
;   pio run -e stm32h743
[env:stm32h743]
platform = ststm32@^20.0.0
board = weact_mini_h743vitx
framework = arduino
build_src_filter = -<*> +<stm32/>
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@^2.36.18
    stm32duino/STM32duino FreeRTOS@^10.3.3
    ; Встроенная библиотека ядра. Явно — потому что тест на плате доходит
    ; до <EEPROM.h> только через <Preferences.h> (флаг -I ниже), а этот
    ; путь поиск зависимостей PlatformIO не просматривает.
    EEPROM
build_flags =
    -D BOARD_STM32H743
    ; printf("%f") в newlib-nano по умолчанию не печатает вещественные числа:
    ; без этого флага в логе, параметрах чёрного ящика и строках состояния
    ; будут пустые значения.
    -D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF
    ; <Preferences.h> для STM32 — хранилище во флеше (compat/Preferences.h).
    -I include/hal/stm32/compat
    ; Буферы UART: кадр iBUS — 32 байта, NAV-PVT — 100 (по умолчанию 64);
    ; передача — под строки лога и кадры MAVLink без ожидания.
    -D SERIAL_RX_BUFFER_SIZE=256
    -D SERIAL_TX_BUFFER_SIZE=1024
    ; Таймаут транзакции I2C, мс (по умолчанию 100) — см. Stm32I2CBus.h.
    -D I2C_TIMEOUT_TICK=5
; Предупреждения — только для кода проекта, не для ядра STM32duino.
; Без -Wshadow: на нём шумят заголовки самого ядра (HardwareSPI.h).
build_src_flags =
    -Wall
    -Wextra
test_ignore =
    native/*
    native_stm32/*
; pio check -e stm32h743 — cppcheck по коду, который есть только здесь.
check_tool = cppcheck
check_skip_packages = yes
check_src_filters =
    +<include/hal/stm32/>
    +<src/stm32/>
check_flags =
    cppcheck: --enable=warning,style,performance,portability --inline-suppr --suppress=*:*/.pio/*

; DevEBox H743 (MCUDEV): тот же чип и пины, что у WeAct, но свой вариант
; ядра (светодиод PA1, кнопки PE3/PC5, слот µSD на SDMMC1) и главное —
; на плате нет USB-UART: консоль, лог и выгрузка чёрного ящика идут
; через USB-C как виртуальный COM-порт (CDC). Serial = USB CDC, как у
; ESP32-C3.
;
; Первая прошивка — через встроенный загрузчик по USB (DFU). Кнопки BOOT0
; на плате нет: соединить пин BT0 с 3V3 проводом, нажать и отпустить RST,
; потом
;   pio run -e stm32h743-devebox -t upload
; Windows нужен драйвер WinUSB для "STM32 BOOTLOADER" (Zadig). Дальше
; клавиша 'D' в консоли (из любого меню, не при ARM) сама перезагружает
; плату в загрузчик — провод больше не нужен.
[env:stm32h743-devebox]
extends = env:stm32h743
board = devebox_h743vitx
upload_protocol = dfu
build_flags =
    ${env:stm32h743.build_flags}
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC

; Нативная сборка на ПК: заголовки прошивки без изменений + фейки
; Arduino core / ESP-IDF / FreeRTOS / U8g2 из test/native/support
; (симулированные I2C/SPI-устройства, UART, LEDC, NVS, Wi-Fi, веб-сервер).
; Распиновка — как у ESP32-S3 (BOARD_ESP32_S3). Покрытие:
;   pio test -e native && gcovr   (настройки — в gcovr.cfg)
[env:native]
platform = native
test_framework = unity
; test/native_stm32 — прошивка STM32, своя среда ниже; test_blackbox_sd — только
; на плате STM32 с картой.
test_ignore =
    native_stm32/*
    test_blackbox_sd
build_flags =
    -std=gnu++17
    -D BOARD_ESP32_S3
    -I test/native/support
    -Wall
    -Wextra
    -Wshadow
    -O0
    -g
    --coverage
    -lgcov
    ; Заголовочные функции, которые ни разу не вызваны, иначе не попадают
    ; в объектный файл — и gcov их не видит, завышая покрытие.
    -fkeep-inline-functions
    -fkeep-static-functions

; Нативная сборка прошивки STM32H743 (src/stm32/main.cpp) на ПК: те же
; фейки, что у env:native, плюс слой STM32duino (test/native/support_stm32:
; пины PA0..PE15, HardwareTimer, UART по пинам, EEPROM-эмуляция,
; FreeRTOS). <Preferences.h> — настоящий compat/Preferences.h поверх
; KeyValueStore: калибровки идут во "флеш" тем же путём, что на плате.
;   pio test -e native-stm32
[env:native-stm32]
platform = native
test_framework = unity
test_filter = native_stm32/*
build_flags =
    -std=gnu++17
    -D BOARD_STM32H743
    -I include/hal/stm32/compat
    -I test/native/support_stm32
    -I test/native/support
    -I test/native
    -Wall
    -Wextra
    -Wshadow
    -O0
    -g
    --coverage
    -lgcov
    -fkeep-inline-functions
    -fkeep-static-functions
