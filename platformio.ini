; Выбор платы — одна строка:
;   pio run -e esp32-c3   (ESP32-C3 SuperMini, текущий прототип, по умолчанию)
;   pio run -e esp32-s3   (ESP32-S3, планируемый основной лётный контроллер)
;   pio run -e esp32-dev  (обычная ESP32 38-pin, для стенда/отладки)
; Пины для каждой платы — в include/Config.h (ищите BOARD_ESP32_*).
; Чтобы прошивка собиралась без -e по умолчанию, поменяйте default_envs.

[platformio]
default_envs = esp32-c3

[env]
framework = arduino
lib_deps =
    madhephaestus/ESP32Servo
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D IR_DEBUG=1
    -D HTTP_DEBUG=0

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D BOARD_ESP32_C3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
monitor_dtr = 0
monitor_rts = 0

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D BOARD_ESP32_S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
monitor_dtr = 0
monitor_rts = 0

[env:esp32-dev]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -D BOARD_ESP32_CLASSIC
