# Покрытие нативных тестов (pio test -e native), подробности — docs/TESTING.md.
#   gcovr                         — сводка по файлам в терминале
#   gcovr --html-details -o coverage/index.html   — отчёт в HTML
root = .
object-directory = .pio/build/native
filter = include/
filter = src/
exclude-unreachable-branches = yes
exclude-throw-branches = yes
print-summary = yes
sort = uncovered-percent
