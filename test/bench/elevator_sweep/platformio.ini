; Стендовый тест: качает руль высоты вверх-вниз с паузами.
; Отдельный проект, в основную прошивку и в `pio test` не входит.
;
;   Залить:            pio run -d test/bench/elevator_sweep -t upload
;   Смотреть лог:      pio device monitor -b 115200
;   Вернуть прошивку:  pio run -e esp32-s3 -t upload   (из корня репозитория)
;
; Пины и ход руля берутся из общего include/config/Config.h — тест
; крутит ровно ту серву и в тех пределах, что и лётная прошивка.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -D BOARD_ESP32_S3
    -D BOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -I$PROJECT_DIR/../../../include
; Заголовки проекта лежат вне этой папки — поиск библиотек PlatformIO
; их не просматривает, поэтому библиотеки ядра указаны явно.
lib_deps =
    Wire
    SPI
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
